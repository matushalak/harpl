[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harpl"
version = "0.1.0"
description = "Hierarchical Attentive Recurrent Predictive Learning for MNIST triplets and moving animals"
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.3",
    "setuptools>=68,<81",
    "pillow==10.2.0",
    "scikit-learn==1.4.1.post1",
    "scipy==1.12.0",
    "torch==2.0.1",
    "torchvision==0.15.2",
    "torchaudio==2.0.2",
    "tensorboard>=2.16",
    "kornia==0.8.0",
    "tqdm==4.66.1",
    "triton==2.0.0",
    "wandb==0.16.1",
]

[tool.setuptools.packages.find]
include = ["harpl*"]
