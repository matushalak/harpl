[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harpl"
version = "0.1.0"
description = "Hierarchical Attentive Recurrent Predictive Learning for MNIST triplets and moving animals"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "setuptools>=68,<81",
    "pillow>=10",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "torch>=2.2",
    "torchvision>=0.17",
    "tensorboard>=2.16",
    "kornia>=0.8",
    "tqdm>=4.66",
    "wandb>=0.16",
]

[tool.setuptools.packages.find]
include = ["harpl*"]
